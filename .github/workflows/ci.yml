name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint (errors only)
        run: npx eslint src --quiet
        continue-on-error: true   # promote to blocking once existing lint debt is cleared
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true   # advisory until the baseline is clean
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-build-only-secret
          DATA_ENCRYPTION_KEY: ci-build-only-key
          DOCUMENT_SIGNING_SECRET: ci-build-only-secret
